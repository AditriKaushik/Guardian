name: Deploy web app

# Publishes two apps on GitHub Pages:
# Live refresh: each run starts the next one itself (job "keep-refreshing" below), because GitHub's
# cron schedule is unreliable. The cron lines are only a backup to restart the loop if it ever stops.
#   /            -> the web/ app (unchanged)
#   /market-compass/ -> Market Compass, rebuilt from LIVE market data on the schedule below
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "market-compass/**"
      - ".github/workflows/pages.yml"
  schedule:
    # Times are UTC. IST = UTC + 5:30.
    - cron: "*/15 3-10 * * 1-5"   # every 15 min, ~08:30-16:15 IST, Mon-Fri (market hours)
    - cron: "0 2 * * 1-5"         # 07:30 IST pre-market
    - cron: "45 13 * * 1-5"       # 19:15 IST, after NSE publishes FII/DII data
    - cron: "30 4 * * 0,6"        # weekend refresh (global markets, calendar)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # lets each run start the next one (self-refreshing loop below)

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-compass/requirements.txt

      - name: Install Market Compass dependencies
        run: pip install -r market-compass/requirements.txt

      - name: Build Market Compass live data (real market data)
        id: mc
        continue-on-error: true
        working-directory: market-compass
        run: >
          python -m compass.build_site ../_mc_data
          --previous-track "${{ steps.pages.outputs.base_url }}/market-compass/track.json"

      - name: Assemble site
        run: |
          mkdir -p _site/market-compass
          cp -r web/. _site/
          cp -r market-compass/web/. _site/market-compass/
          if [ -f _mc_data/data.json ]; then
            cp _mc_data/data.json _mc_data/track.json _site/market-compass/
          else
            echo "::warning::Market Compass build failed; keeping the previously published data"
            for f in data.json track.json; do
              curl -fsSL "${{ steps.pages.outputs.base_url }}/market-compass/$f" -o "_site/market-compass/$f" || true
            done
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  keep-refreshing:
    # Starts the next run after a pause: ~every 10 min in market hours, hourly otherwise, 3-hourly at weekends.
    needs: deploy
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Wait, then start the next refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hm=$(TZ=Asia/Kolkata date +%H%M); dow=$(TZ=Asia/Kolkata date +%u)
          if (( dow <= 5 && 10#$hm >= 845 && 10#$hm <= 1545 )); then pause=420
          elif (( dow <= 5 )); then pause=3000
          else pause=10800; fi
          newer() {  # number of newer runs of this workflow still queued or running
            gh run list -R "$GITHUB_REPOSITORY" --workflow pages.yml --limit 30 --json databaseId,status \
              --jq "[.[] | select(.status != \"completed\" and .databaseId > $GITHUB_RUN_ID)] | length"
          }
          echo "IST $hm (day $dow): next refresh in $((pause/60)) min"
          sleep $pause
          if [ "$(newer)" -gt 0 ]; then echo "A newer run is already refreshing; this loop stops here."; exit 0; fi
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
