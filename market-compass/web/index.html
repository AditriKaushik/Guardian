<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Compass</title>
<meta name="description" content="Live Indian stock-market compass: macro scorecard, smart money, stock probabilities and a live track record.">
<meta name="theme-color" content="#0f2a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compass">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="30" height="30"><span>Market Compass</span></div>
  <div class="status" id="status">Loading live data…</div>
  <button id="installBtn" class="install" hidden>⬇ Install app</button>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="compass" class="on">🧭 Compass</button>
  <button data-tab="picks">⭐ Daily picks</button>
  <button data-tab="news">📰 Overnight news</button>
  <button data-tab="history">📜 History lab</button>
  <button data-tab="stocks">📈 Stocks</button>
  <button data-tab="money">🐋 Smart money</button>
  <button data-tab="calendar">📅 Calendar</button>
  <button data-tab="track">🎯 Live track record</button>
  <button data-tab="guide">📖 Guide</button>
</nav>
<main>
  <section id="compass" class="tab on"></section>
  <section id="picks" class="tab"></section>
  <section id="news" class="tab"></section>
  <section id="history" class="tab"></section>
  <section id="stocks" class="tab"></section>
  <section id="money" class="tab"></section>
  <section id="calendar" class="tab"></section>
  <section id="track" class="tab"></section>
  <section id="guide" class="tab"></section>
</main>
<footer>Live data: Yahoo Finance &amp; NSE, refreshed automatically about every 5 minutes in market hours; each price shows its exact time.
Educational tool, not investment advice. Always use a stop-loss.</footer>
<script src="app.js"></script>
</body>
</html>
