name: Baat Buddy APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BaatBuddy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BaatBuddy-apk
          path: android/BaatBuddy.apk

      # On main, also publish the APK as a release so it can be downloaded straight to a phone.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: baat-buddy-latest
          name: Baat Buddy (latest)
          body: बच्चों के लिए बात करने वाला ऐप। BaatBuddy.apk डाउनलोड करके फ़ोन में इंस्टॉल करें।
          files: android/BaatBuddy.apk
          make_latest: true
