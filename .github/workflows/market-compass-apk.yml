name: Market Compass APK

# Builds the Market Compass Android app (market-compass/android, a WebView shell around the live
# web app) and publishes it as a GitHub Release asset with a fixed download link:
#   https://github.com/<owner>/<repo>/releases/download/market-compass-apk/MarketCompass.apk
on:
  push:
    branches: [main]
    paths:
      - "market-compass/android/**"
      - ".github/workflows/market-compass-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # to create/update the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: market-compass/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/MarketCompass.apk"
          ls -l "$RUNNER_TEMP/MarketCompass.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MarketCompass-apk
          path: ${{ runner.temp }}/MarketCompass.apk

      - name: Publish to the "market-compass-apk" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=market-compass-apk
          NOTES="Market Compass Android app (build ${GITHUB_RUN_NUMBER}, ${GITHUB_SHA::7}). Install: download MarketCompass.apk on your phone, open it, and allow 'Install unknown apps' for your browser when Android asks. The app shows the live site, so data is always current."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Market Compass Android app" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/MarketCompass.apk" -R "$GITHUB_REPOSITORY" --clobber
