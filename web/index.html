<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>नन्हा स्कूल</title>
<meta name="description" content="छोटे बच्चों के लिए तस्वीर और आवाज़ से सीखने वाला ऐप — ABC, वर्णमाला, गिनती, रंग, जानवर, कविताएँ और खेल।">
<meta name="theme-color" content="#FF8A3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="नन्हा स्कूल">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: a single phone frame centred on the page; screens swap inside it. Deliberately one bright kids' theme. */
  :root {
    color-scheme: light;
    --page: #EFE7D6;
    --bg: #FFF8E7;
    --header: #FF8A3D;
    --header-ink: #FFFFFF;
    --ink: #2B2B2B;
    --muted: #7A7266;
    --card: #FFFFFF;
    --kid: #C8F0D8;
    --send: #2EAD6B;
    --mic: #4C8BF5;
    --stop: #EF5350;
    --font: "Baloo 2", "Nirmala UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { background: var(--page); color: var(--ink); font-family: var(--font); }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 16px 32px;
  }
  .intro { max-width: 380px; text-align: center; }
  .intro h1 { margin: 0 0 4px; font-size: 26px; font-weight: 800; color: #E56A1C; text-wrap: balance; }
  .intro p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; }

  /* Phone frame */
  .phone {
    width: 100%;
    max-width: 380px;
    height: 720px;
    max-height: 82vh;
    background: #1d1d1f;
    border-radius: 40px;
    padding: 12px;
    box-shadow: 0 18px 50px rgba(0,0,0,.3);
    position: relative;
  }
  .screen {
    background: var(--bg);
    border-radius: 30px;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .notch {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 22px; background: #1d1d1f; border-radius: 0 0 14px 14px; z-index: 5;
  }

  .topbar {
    background: var(--header); color: var(--header-ink);
    display: flex; align-items: center; gap: 8px;
    padding: 14px 14px 12px; padding-top: 26px;
    flex-shrink: 0;
  }
  .topbar .title { flex: 1; font-size: 20px; font-weight: 800; min-width: 0; }
  .roundbtn {
    width: 40px; height: 40px; border: none; border-radius: 50%;
    background: #ffffff; font-size: 18px; cursor: pointer; flex-shrink: 0;
    display: grid; place-items: center; font-family: var(--font);
  }
  .prog { font-size: 15px; font-weight: 600; opacity: .95; }

  .body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }

  /* Home grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
  .tile {
    border: none; border-radius: 22px; color: #fff; cursor: pointer;
    aspect-ratio: 1 / 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    font-family: var(--font); padding: 6px;
  }
  .tile .ic { font-size: 40px; line-height: 1.1; }
  .tile .lb { font-size: 16px; font-weight: 700; }
  .homehead { text-align: center; padding: 12px 12px 0; }
  .homehead h2 { margin: 0; font-size: 24px; font-weight: 800; color: #E56A1C; }
  .homehead p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  /* Flashcard */
  .cardwrap { flex: 1; display: flex; flex-direction: column; padding: 12px; }
  .card {
    flex: 1; background: var(--card); border-radius: 26px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 16px; text-align: center; transition: background .15s;
  }
  .card .big { font-size: 96px; line-height: 1.05; }
  .card .big.small { font-size: 46px; }
  .card .cap { font-size: 24px; font-weight: 700; white-space: pre-line; line-height: 1.3; }
  .card .taphint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .navrow { display: flex; gap: 10px; padding: 10px 12px 14px; }
  .navbtn {
    flex: 1; border: none; border-radius: 18px; color: #fff; cursor: pointer;
    padding: 16px 0; font-size: 18px; font-weight: 700; font-family: var(--font);
  }

  /* Rhymes */
  .rlist { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
  .rbtn {
    border: none; border-radius: 18px; color: #fff; cursor: pointer;
    padding: 18px 16px; font-size: 18px; font-weight: 700; text-align: left; font-family: var(--font);
  }
  .rplayer { flex: 1; display: flex; flex-direction: column; padding: 14px; }
  .rwords { flex: 1; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 22px; font-weight: 600; line-height: 1.7; white-space: pre-line; padding: 10px; }

  /* Quiz */
  .quiz { flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 12px; }
  .qtext { text-align: center; font-size: 24px; font-weight: 800; color: #E56A1C; min-height: 34px; }
  .opts { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .opt {
    flex: 1; border: none; border-radius: 20px; background: var(--card); cursor: pointer;
    font-size: 58px; display: grid; place-items: center; font-family: var(--font);
  }

  /* Chat */
  .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .bub { max-width: 82%; padding: 10px 14px; font-size: 16px; line-height: 1.35; white-space: pre-line; }
  .bub.b { align-self: flex-start; background: var(--card); border-radius: 16px 16px 16px 4px; }
  .bub.k { align-self: flex-end; background: var(--kid); border-radius: 16px 16px 4px 16px; }
  .inrow { display: flex; gap: 8px; padding: 8px; background: #fff; flex-shrink: 0; }
  .inrow input {
    flex: 1; min-width: 0; border: 2px solid #eee; border-radius: 14px;
    padding: 12px; font-size: 16px; font-family: var(--font);
  }
  .inrow button { border: none; border-radius: 14px; background: var(--send); color: #fff;
    padding: 0 16px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--font); }

  .footnote { max-width: 380px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .footnote a { color: #C25A12; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Web-app shell: the app fills the screen; on wide screens it sits in a centred column. */
  html, body { height: 100%; margin: 0; }
  .screen {
    max-width: 480px; margin: 0 auto;
    height: 100vh; height: 100dvh;
    border-radius: 0;
    box-shadow: 0 0 40px rgba(0,0,0,.10);
  }
  .topbar { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  .install {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    border: none; border-radius: 999px; background: var(--send); color: #fff;
    padding: 12px 22px; font-size: 16px; font-weight: 700; font-family: var(--font);
    box-shadow: 0 6px 20px rgba(0,0,0,.2); cursor: pointer; z-index: 10;
  }

  /* Subscription: locked tiles, the parents' banner, and the grown-ups' screens. */
  .tile { position: relative; }
  .tile.locked { filter: saturate(.35) brightness(.97); }
  .tile .lock { position: absolute; top: 8px; right: 10px; font-size: 20px; }
  .rbtn.locked { opacity: .6; }
  .banner {
    margin: 2px 12px 16px; padding: 12px 14px; border: none; border-radius: 16px;
    background: var(--card); color: var(--ink); font-family: var(--font);
    font-size: 15px; font-weight: 600; text-align: center; cursor: pointer;
    box-shadow: 0 1px 0 rgba(0,0,0,.06);
  }
  .panel { padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 12px; }
  .ptitle { margin: 0; font-size: 22px; font-weight: 800; color: #E56A1C; text-wrap: balance; }
  .plead { margin: 0; font-size: 17px; line-height: 1.5; }
  .pq { margin: 4px 0; font-size: 42px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
  .pin {
    width: 100%; border: 2px solid #E8DCC4; border-radius: 14px; padding: 14px;
    font-size: 18px; font-family: var(--font); background: var(--card); color: var(--ink);
  }
  .pbtn {
    border: none; border-radius: 14px; background: var(--send); color: #fff; padding: 15px;
    font-size: 18px; font-weight: 700; font-family: var(--font); cursor: pointer;
  }
  .pbtn.secondary { background: #9E9E9E; }
  .pbtn.danger { background: var(--stop); }
  .pbtn:disabled { opacity: .6; cursor: default; }
  .plink {
    border: none; background: none; color: #C25A12; font-size: 15px; font-family: var(--font);
    text-decoration: underline; cursor: pointer; padding: 4px;
  }
  .plist { margin: 0; padding: 0; list-style: none; font-size: 16px; line-height: 1.8; }
  .price { margin: 0; font-size: 28px; font-weight: 800; }
  .psmall { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .pmsg { margin: 0; min-height: 20px; font-size: 15px; color: #B3261E; }
  .pmsg.ok { color: #1E7A48; }
  .mono {
    margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 14px; word-break: break-all;
    background: var(--card); padding: 10px 12px; border-radius: 10px; user-select: all;
  }
  .pin:focus-visible, .pbtn:focus-visible, .plink:focus-visible, .banner:focus-visible, .tile:focus-visible {
    outline: 3px solid var(--mic); outline-offset: 2px;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <button class="roundbtn" id="backBtn" hidden aria-label="वापस">🏠</button>
    <div class="title" id="scrTitle">😊 नन्हा स्कूल</div>
    <div class="prog" id="prog"></div>
    <button class="roundbtn" id="soundBtn" aria-label="आवाज़">🔊</button>
  </div>
  <div class="body" id="body"></div>
</div>
<button class="install" id="installBtn" hidden>📲 ऐप इंस्टॉल करें</button>
<script src="config.js"></script>
<script>
/* ---------------- Syllabus data (mirrors the app) ---------------- */
const PALETTE = ["#EF5350","#AB47BC","#5C6BC0","#29B6F6","#26A69A","#66BB6A","#9CCC65","#FFA726","#FF7043","#8D6E63","#EC407A","#7E57C2","#42A5F5"];

const ABC = [["A","Apple","🍎"],["B","Ball","⚽"],["C","Cat","🐈"],["D","Dog","🐕"],["E","Elephant","🐘"],["F","Fish","🐟"],["G","Grapes","🍇"],["H","Hat","🎩"],["I","Ice cream","🍦"],["J","Juice","🧃"],["K","Kite","🪁"],["L","Lion","🦁"],["M","Monkey","🐒"],["N","Nest","🪺"],["O","Orange","🍊"],["P","Parrot","🦜"],["Q","Queen","👑"],["R","Rabbit","🐇"],["S","Sun","☀️"],["T","Tiger","🐯"],["U","Umbrella","☂️"],["V","Van","🚐"],["W","Watch","⌚"],["X","Xylophone","🎶"],["Y","Yak","🐂"],["Z","Zebra","🦓"]];
const VARN = [["अ","अनार","🍎"],["आ","आम","🥭"],["इ","इमली","🌿"],["ई","ईख","🌾"],["उ","उल्लू","🦉"],["ऊ","ऊन","🧶"],["ए","एड़ी","🦶"],["ऐ","ऐनक","👓"],["ओ","ओखली","🪵"],["औ","औरत","👩"],["अं","अंगूर","🍇"],["क","कमल","🌸"],["ख","खरगोश","🐇"],["ग","गमला","🪴"],["घ","घड़ी","⌚"],["च","चम्मच","🥄"],["छ","छाता","☂️"],["ज","जहाज़","✈️"],["झ","झंडा","🚩"],["ट","टमाटर","🍅"],["ठ","ठठेरा","🔨"],["ड","डमरू","🥁"],["ढ","ढोल","🥁"],["त","तितली","🦋"],["थ","थाली","🍽️"],["द","दवात","🖋️"],["ध","धनुष","🏹"],["न","नल","🚰"],["प","पतंग","🪁"],["फ","फल","🍎"],["ब","बकरी","🐐"],["भ","भालू","🐻"],["म","मछली","🐟"],["य","यंत्र","⚙️"],["र","रथ","🛕"],["ल","लट्टू","🪀"],["व","वन","🌳"],["श","शेर","🦁"],["स","सेब","🍎"],["ह","हाथी","🐘"],["क्ष","क्षत्रिय","🛡️"],["त्र","त्रिशूल","🔱"],["ज्ञ","ज्ञानी","📖"]];
const NUMW = ["एक","दो","तीन","चार","पाँच","छह","सात","आठ","नौ","दस"];
const NUME = ["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"];

function card(big, cap, speak, lang, bg){ return {big, cap, speak, lang, bg}; }

function englishAbc(){ return ABC.map(r => card(r[0], r[0]+" for "+r[1]+"  "+r[2], r[0]+" for "+r[1], "en")); }
function hindiVarn(){ return VARN.map(r => card(r[0], r[0]+" से "+r[1]+"  "+r[2], r[0]+" से "+r[1], "hi")); }
function numbers(){ return NUMW.map((w,i)=>{ const n=i+1; return card(String(n), "🍎".repeat(n)+"\n"+w+" · "+NUME[i], w, "hi"); }); }
function colors(){ return [
  card("🔴","लाल · Red","लाल","hi","#E53935"),card("🟢","हरा · Green","हरा","hi","#43A047"),
  card("🔵","नीला · Blue","नीला","hi","#1E88E5"),card("🟡","पीला · Yellow","पीला","hi","#FDD835"),
  card("🟠","नारंगी · Orange","नारंगी","hi","#FB8C00"),card("🟣","बैंगनी · Purple","बैंगनी","hi","#8E24AA"),
  card("🟤","भूरा · Brown","भूरा","hi","#6D4C41"),card("⚫","काला · Black","काला","hi","#212121"),
  card("⚪","सफ़ेद · White","सफ़ेद","hi","#FAFAFA"),card("🌸","गुलाबी · Pink","गुलाबी","hi","#EC407A")]; }
function shapes(){ return [card("⭕","वृत्त · Circle","वृत्त","hi"),card("🟥","वर्ग · Square","वर्ग","hi"),card("🔺","त्रिकोण · Triangle","त्रिकोण","hi"),card("⭐","तारा · Star","तारा","hi"),card("❤️","दिल · Heart","दिल","hi"),card("🔷","हीरा · Diamond","हीरा","hi")]; }
function animals(){ return [
  card("🐄","गाय · Cow","गाय बोलती है, मूँ मूँ","hi"),card("🐕","कुत्ता · Dog","कुत्ता बोलता है, भौं भौं","hi"),
  card("🐈","बिल्ली · Cat","बिल्ली बोलती है, म्याऊँ म्याऊँ","hi"),card("🦁","शेर · Lion","शेर दहाड़ता है, दहाड़","hi"),
  card("🐐","बकरी · Goat","बकरी बोलती है, में में","hi"),card("🐓","मुर्गा · Rooster","मुर्गा बोलता है, कुकड़ूँ कूँ","hi"),
  card("🐘","हाथी · Elephant","हाथी बहुत बड़ा होता है","hi"),card("🐒","बंदर · Monkey","बंदर पेड़ पर कूदता है","hi"),
  card("🐸","मेंढक · Frog","मेंढक बोलता है, टर्र टर्र","hi"),card("🐦","चिड़िया · Bird","चिड़िया बोलती है, चूँ चूँ","hi")]; }
function fruits(){ return [card("🍎","सेब · Apple","सेब","hi"),card("🍌","केला · Banana","केला","hi"),card("🥭","आम · Mango","आम","hi"),card("🍇","अंगूर · Grapes","अंगूर","hi"),card("🍊","संतरा · Orange","संतरा","hi"),card("🍉","तरबूज़ · Watermelon","तरबूज़","hi"),card("🥕","गाजर · Carrot","गाजर","hi"),card("🍅","टमाटर · Tomato","टमाटर","hi"),card("🥔","आलू · Potato","आलू","hi"),card("🧅","प्याज़ · Onion","प्याज़","hi")]; }
function vehicles(){ return [card("🚗","कार · Car","कार","hi"),card("🚌","बस · Bus","बस","hi"),card("🚂","रेलगाड़ी · Train","रेलगाड़ी","hi"),card("✈️","हवाई जहाज़ · Aeroplane","हवाई जहाज़","hi"),card("🚲","साइकिल · Cycle","साइकिल","hi"),card("🛺","ऑटो · Auto","ऑटो रिक्शा","hi"),card("⛵","नाव · Boat","नाव","hi"),card("🚑","एम्बुलेंस · Ambulance","एम्बुलेंस","hi")]; }
function bodyParts(){ return [card("👁️","आँख · Eye","आँख, इससे हम देखते हैं","hi"),card("👂","कान · Ear","कान, इससे हम सुनते हैं","hi"),card("👃","नाक · Nose","नाक, इससे हम सूँघते हैं","hi"),card("👄","मुँह · Mouth","मुँह, इससे हम बोलते और खाते हैं","hi"),card("✋","हाथ · Hand","हाथ, इससे हम काम करते हैं","hi"),card("🦶","पैर · Foot","पैर, इससे हम चलते हैं","hi"),card("🦷","दाँत · Teeth","दाँत, इनसे हम चबाते हैं","hi"),card("💇","बाल · Hair","बाल","hi")]; }
function manners(){ return [card("🙏","नमस्ते","बड़ों को नमस्ते कहते हैं","hi"),card("😊","धन्यवाद","कोई कुछ दे तो धन्यवाद कहते हैं","hi"),card("🙂","कृपया","कुछ माँगते समय कृपया कहते हैं","hi"),card("🤝","माफ़ करना","गलती हो जाए तो माफ़ी माँगते हैं","hi"),card("🪥","ब्रश करो","सुबह उठकर दाँत साफ़ करते हैं","hi"),card("🧼","हाथ धोओ","खाने से पहले हाथ धोते हैं","hi"),card("🍎","फल खाओ","हरी सब्ज़ी और फल खाने से हम मज़बूत बनते हैं","hi"),card("😴","जल्दी सोओ","रात को जल्दी सोते हैं और सुबह जल्दी उठते हैं","hi")]; }

const LESSONS = [
  {icon:"🔤", title:"ABC", get:englishAbc, lang:"en", say:"अंग्रेज़ी अक्षर"},
  {icon:"अ", title:"अक्षर", get:hindiVarn, lang:"hi", say:"हिंदी वर्णमाला"},
  {icon:"🔢", title:"गिनती", get:numbers, lang:"hi", say:"एक दो तीन, गिनती सीखो"},

  {icon:"🔷", title:"आकार", get:shapes, lang:"hi", say:"आकार सीखो"},
  {icon:"🐘", title:"जानवर", get:animals, lang:"hi", say:"जानवर और उनकी आवाज़"},
  {icon:"🍎", title:"फल-सब्ज़ी", get:fruits, lang:"hi", say:"फल और सब्ज़ियाँ"},
  {icon:"🚗", title:"वाहन", get:vehicles, lang:"hi", say:"गाड़ियों के नाम"},
  {icon:"✋", title:"शरीर", get:bodyParts, lang:"hi", say:"शरीर के अंग"},
  {icon:"🙏", title:"अच्छी बातें", get:manners, lang:"hi", say:"प्यार से बोलना सीखो"},

/* ---------------- Speech ---------------- */
let soundOn = true;
let voices = [];
function loadVoices(){ try { voices = window.speechSynthesis.getVoices() || []; } catch(e){ voices = []; } }
loadVoices();
if (window.speechSynthesis) { window.speechSynthesis.onvoiceschanged = loadVoices; }

function clean(t){ return (t||"").replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu," ").replace(/·/g," ").replace(/\s+/g," ").trim(); }
function pickVoice(lang){
  const pref = lang === "en" ? "en" : "hi";
  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith(pref)) ||
         (pref === "hi" ? voices.find(v => /hi|india/i.test(v.name)) : null) || null;
}
function speak(text, lang){
  if (!soundOn || !window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean(text));
    u.lang = lang === "en" ? "en-US" : "hi-IN";
    const v = pickVoice(lang); if (v) u.voice = v;
    u.rate = 0.9; u.pitch = 1.2;
    window.speechSynthesis.speak(u);
  } catch(e){}
}
function speakLines(lines, lang){ speak(lines.join(", "), lang); }
function stopSpeak(){ try { window.speechSynthesis.cancel(); } catch(e){} }

function openLesson(lesson){
  const cards = lesson.get();

  setTop(lesson.title, true);
  speak(lesson.say, lesson.lang);
  body.innerHTML = "";
  const wrap = el("div","cardwrap");
  const card = el("div","card");
  const big = el("div","big");
  const cap = el("div","cap");
  const hint = el("div","taphint","🔊 सुनने के लिए तस्वीर दबाओ");

  card.onclick = () => sayCurrent();

  const next = el("button","navbtn","आगे ▶"); next.style.background = "#2EAD6B";
  prev.onclick = () => show(idx-1);
  next.onclick = () => show(idx+1);
  nav.append(prev, next);
  wrap.append(card, nav);
  body.appendChild(wrap);

  function sayCurrent(){ const c = cards[idx]; if(c) speak(c.speak, c.lang || lesson.lang); }
  function show(i){
    if (i < 0) return;
    if (i >= cards.length){
      card.style.background = "#C8F0D8";
      big.textContent = "🥳"; big.className = "big";
      cap.textContent = "🎉 शाबाश! तुमने पूरा कर लिया! 🌟";
      prog.textContent = "";
      speak("शाबाश! तुमने पूरा कर लिया। बहुत बढ़िया!", "hi");
      return;
    }
    idx = i; const c = cards[i];
    card.style.background = c.bg || "#FFFFFF";
    const dark = c.bg ? isDark(c.bg) : false;
    cap.style.color = dark ? "#fff" : "var(--ink)";
    hint.style.color = dark ? "rgba(255,255,255,.8)" : "var(--muted)";
    big.textContent = c.big;

    cap.textContent = c.cap;
    prog.textContent = (i+1) + "/" + cards.length;
    sayCurrent();
  }
  show(0);
}

function isDark(hex){
  const n = parseInt(hex.slice(1),16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return (0.299*r + 0.587*g + 0.114*b) < 140;
}

/* ---------------- Subscription: 7-day free trial, then premium ----------------
   Payments stay off (everything free) until config.js has API_BASE and PUBLIC_KEY_JWK.
   The trial needs no signup or card. After it, a few lessons stay free forever and
   the rest wait behind a grown-ups' question, so a child never sees a payment screen. */
const CFG = Object.assign({
  API_BASE: "", PUBLIC_KEY_JWK: null, TRIAL_DAYS: 7, PRICE_TEXT: "",
  FREE: ["ABC", "गिनती"], FREE_RHYMES: 2,
}, window.NS_CONFIG || {});
const PAYMENTS_ON = !!(CFG.API_BASE && CFG.PUBLIC_KEY_JWK && window.crypto && window.crypto.subtle);
const DAY = 86400000;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
let subscribed = false;

/* The trial clock never runs backwards, so moving the phone's date back doesn't extend it. */
function nowMs(){
  const seen = Number(store.get("ns_seen")) || 0;
  const t = Math.max(Date.now(), seen);
  store.set("ns_seen", String(t));
  return t;
}
function trialDaysLeft(){
  let start = Number(store.get("ns_trial"));
  if (!start) { start = nowMs(); store.set("ns_trial", String(start)); }
  return Math.max(0, Math.ceil((start + CFG.TRIAL_DAYS * DAY - nowMs()) / DAY));
}
function hasAccess(){ return !PAYMENTS_ON || subscribed || trialDaysLeft() > 0; }
function isLocked(label){ return label !== "कविताएँ" && !CFG.FREE.includes(label) && !hasAccess(); }
function rhymeLocked(i){ return i >= CFG.FREE_RHYMES && !hasAccess(); }

/* A pass is "payload.signature", signed by the server; checked here with the public key. */
function fromB64url(s){
  let t = s.replace(/-/g, "+").replace(/_/g, "/");
  while (t.length % 4) t += "=";
  const bin = atob(t);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function readPass(token){
  try {
    const [payload, sig] = String(token).split(".");
    if (!payload || !sig) return null;
    const key = await crypto.subtle.importKey("jwk", CFG.PUBLIC_KEY_JWK, { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
    const ok = await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, key, fromB64url(sig), new TextEncoder().encode(payload));
    return ok ? JSON.parse(new TextDecoder().decode(fromB64url(payload))) : null;
  } catch (e) { return null; }
}
async function savePass(token){
  const pass = await readPass(token);
  if (!pass) return false;
  store.set("ns_pass", token);
  subscribed = pass.exp > nowMs() / 1000;
  return subscribed;
}
/* Re-checks the stored pass and quietly renews it near the end of the paid period.
   Returns true when what the child can open has changed. */
async function refreshEntitlement(){
  if (!PAYMENTS_ON) return false;
  const before = hasAccess() + "|" + subscribed;
  const token = store.get("ns_pass");
  const pass = token ? await readPass(token) : null;
  if (token && !pass) store.del("ns_pass");
  const t = nowMs() / 1000;
  subscribed = !!(pass && pass.exp > t);
  if (pass && pass.exp - t < 3 * 86400) {
    try { const r = await api("/api/refresh", { token }); await savePass(r.token); } catch (e) {}
  }
  return before !== hasAccess() + "|" + subscribed;
}

async function api(path, data){
  let res;
  try {
    res = await fetch(CFG.API_BASE.replace(/\/+$/, "") + path, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data),
    });
  } catch (e) { throw { code: "network" }; }
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw { code: out.error || "server_error" };
  return out;
}
function errorText(e){
  return ({
    network: "इंटरनेट से जुड़ें और फिर कोशिश करें।",
    bad_email: "ईमेल सही नहीं है।",
    bad_request: "ईमेल और सब्सक्रिप्शन ID दोबारा जाँचें।",
    not_found: "यह सब्सक्रिप्शन नहीं मिला। ईमेल और ID दोबारा जाँचें।",
    not_active: "यह सब्सक्रिप्शन अभी चालू नहीं है।",
    bad_signature: "भुगतान की जाँच नहीं हो पाई।",
  })[e && e.code] || "कुछ गड़बड़ हुई। थोड़ी देर बाद फिर कोशिश करें।";
}
function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = () => reject({ code: "network" });
    document.head.appendChild(s);
  });
}

/* Small builders that only ever set text, never HTML. */
function txt(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = text; return e; }
function button(label, cls, onClick){ const b = txt("button", cls, label); b.type = "button"; b.onclick = onClick; return b; }
function field(id, type, placeholder, value){
  const i = document.createElement("input");
  i.className = "pin"; i.id = id; i.type = type; i.placeholder = placeholder; i.value = value || "";
  i.setAttribute("aria-label", placeholder);
  if (type === "email") i.autocomplete = "email";
  return i;
}
function panel(title){
  stopSpeak();
  body.innerHTML = "";
  const box = el("div", "panel");
  if (title) box.appendChild(txt("h3", "ptitle", title));
  body.appendChild(box);
  return box;
}

function statusBanner(){
  if (!PAYMENTS_ON) return null;
  let label = "⭐ प्रीमियम चालू है";
  if (!subscribed) {
    const left = trialDaysLeft();
    label = left > 0 ? `🎁 मुफ़्त ट्रायल: ${left} दिन बाकी · बड़ों के लिए` : "🔒 कुछ पाठ बंद हैं · बड़ों के लिए: पूरा ऐप खोलें";
  }
  return button(label, "banner", () => parentGate(paywall));
}

function askGrownUp(){
  parentGate(paywall);
  speak("ये खोलने के लिए मम्मी या पापा को बुलाओ", "hi");
}

/* A question small children can't answer yet, so payments are only ever seen by grown-ups. */
function parentGate(next){
  setTop("👨‍👩‍👧 बड़ों के लिए", true);
  const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4);
  const box = panel("यह हिस्सा माता-पिता के लिए है");
  const answer = field("gateAnswer", "text", "जवाब", "");
  answer.inputMode = "numeric"; answer.autocomplete = "off";
  const msg = txt("p", "pmsg", "");
  const check = () => {
    const given = Number(answer.value.replace(/[०-९]/g, d => String(d.charCodeAt(0) - 0x0966)).trim());
    if (given === a * b) { next(); return; }
    msg.textContent = "जवाब सही नहीं है। नया सवाल…";
    setTimeout(() => parentGate(next), 900);
  };
  answer.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  box.append(txt("p", "plead", "आगे जाने के लिए इस सवाल का जवाब लिखें:"),
             txt("p", "pq", `${a} × ${b} = ?`), answer, button("आगे", "pbtn", check), msg);
}

function paywall(){
  if (subscribed) { account(); return; }
  setTop("⭐ प्रीमियम", true);
  const left = trialDaysLeft();
  const box = panel("पूरा नन्हा स्कूल खोलें");
  const list = document.createElement("ul"); list.className = "plist";
  ["सारे 10 पाठ, सारी कविताएँ, खेल और बातचीत", "कोई विज्ञापन नहीं",
   "बच्चे का कोई निजी डेटा नहीं लिया जाता", "कभी भी रद्द करें"]
    .forEach(t => list.appendChild(txt("li", null, "✓ " + t)));
  box.appendChild(list);
  if (CFG.PRICE_TEXT) box.appendChild(txt("p", "price", CFG.PRICE_TEXT));
  box.appendChild(txt("p", "psmall", left > 0
    ? `आपके मुफ़्त ट्रायल के ${left} दिन बाकी हैं। अभी सब्सक्राइब करें — पहला भुगतान ट्रायल ख़त्म होने के बाद ही होगा। (कार्ड या UPI की पुष्टि के लिए बैंक एक छोटी राशि ले सकता है, जो अपने-आप वापस हो जाती है।)`
    : "मुफ़्त ट्रायल पूरा हो गया। सब्सक्राइब करके सारे पाठ फिर से खोलें।"));
  const email = field("payEmail", "email", "आपका ईमेल (रसीद इसी पर आएगी)", store.get("ns_email"));
  const msg = txt("p", "pmsg", "");
  const pay = button("सब्सक्राइब करें", "pbtn", () => startCheckout(email.value, msg, pay));
  box.append(email, pay, msg,
    txt("p", "psmall", "भुगतान Razorpay के सुरक्षित पेज पर होता है: UPI, कार्ड या नेटबैंकिंग। कार्ड की जानकारी इस ऐप तक कभी नहीं आती।"),
    button("पहले से सब्सक्राइब किया है? यहाँ वापस पाएँ", "plink", restoreView));
}

async function startCheckout(emailValue, msg, pay){
  const email = String(emailValue || "").trim();
  msg.className = "pmsg";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { msg.textContent = "कृपया सही ईमेल लिखें।"; return; }
  pay.disabled = true;
  msg.textContent = "एक पल…";
  try {
    const { subscription_id, key_id } = await api("/api/subscribe", { email, trial_days_left: trialDaysLeft() });
    store.set("ns_email", email);
    if (!window.Razorpay) await loadScript("https://checkout.razorpay.com/v1/checkout.js");
    msg.textContent = "";
    const checkout = new window.Razorpay({
      key: key_id,
      subscription_id,
      name: "नन्हा स्कूल",
      description: "प्रीमियम सब्सक्रिप्शन",
      prefill: { email },
      theme: { color: "#FF8A3D" },
      handler: async resp => {
        msg.textContent = "भुगतान की जाँच हो रही है…";
        try {
          const r = await api("/api/verify", {
            razorpay_payment_id: resp.razorpay_payment_id,
            razorpay_subscription_id: resp.razorpay_subscription_id,
            razorpay_signature: resp.razorpay_signature,
          });
          store.set("ns_sub", subscription_id);
          if (await savePass(r.token)) { thanks(subscription_id); return; }
          throw { code: "not_active" };
        } catch (e) {
          pay.disabled = false;
          msg.textContent = "भुगतान हो गया, पर जाँच पूरी नहीं हुई। थोड़ी देर बाद 'वापस पाएँ' से खोलें। ID: " + subscription_id;
        }
      },
      modal: { ondismiss: () => { pay.disabled = false; msg.textContent = "भुगतान पूरा नहीं हुआ। आप फिर से कोशिश कर सकते हैं।"; } },
    });
    checkout.open();
  } catch (e) {
    pay.disabled = false;
    msg.textContent = errorText(e);
  }
}

function thanks(subId){
  setTop("🎉 धन्यवाद!", true);
  const box = panel("प्रीमियम चालू हो गया! 🎉");
  box.append(
    txt("p", "plead", "अब बच्चा सारे पाठ, कविताएँ, खेल और बातचीत इस्तेमाल कर सकता है।"),
    txt("p", "psmall", "आपकी सब्सक्रिप्शन ID (रसीद वाले ईमेल में भी है)। दूसरे फ़ोन पर ऐप खोलने के लिए यही ID और आपका ईमेल चाहिए:"),
    txt("p", "mono", subId),
    button("ऐप पर चलें", "pbtn", goHome));
}

function restoreView(){
  setTop("🔄 वापस पाएँ", true);
  const box = panel("पहले से सब्सक्राइब किया है?");
  const email = field("restoreEmail", "email", "ईमेल", store.get("ns_email"));
  const sid = field("restoreSub", "text", "सब्सक्रिप्शन ID (sub_…)", store.get("ns_sub"));
  sid.autocomplete = "off";
  const msg = txt("p", "pmsg", "");
  const go = button("वापस पाएँ", "pbtn", async () => {
    go.disabled = true;
    msg.className = "pmsg"; msg.textContent = "जाँच हो रही है…";
    const e = email.value.trim(), s = sid.value.trim();
    try {
      const r = await api("/api/restore", { email: e, subscription_id: s });
      if (!(await savePass(r.token))) throw { code: "not_active" };
      store.set("ns_email", e); store.set("ns_sub", s);
      thanks(s);
    } catch (err) { go.disabled = false; msg.textContent = errorText(err); }
  });
  box.append(txt("p", "psmall", "वही ईमेल और सब्सक्रिप्शन ID लिखें जो रसीद में है (sub_ से शुरू होती है)।"),
             email, sid, go, msg);
}

function account(){
  setTop("⭐ प्रीमियम", true);
  const box = panel("आपका प्रीमियम चालू है ⭐");
  box.appendChild(txt("p", "plead", "यह अपने-आप नवीनीकृत होता है। रद्द करने पर, जितने दिनों के पैसे दिए हैं उतने दिन ऐप चलता रहेगा।"));
  const sid = store.get("ns_sub");
  if (sid) box.append(txt("p", "psmall", "सब्सक्रिप्शन ID:"), txt("p", "mono", sid));
  const msg = txt("p", "pmsg", "");
  const confirmRow = el("div", "panel"); confirmRow.style.padding = "0"; confirmRow.hidden = true;
  const cancelBtn = button("सब्सक्रिप्शन रद्द करें", "pbtn danger", () => { cancelBtn.hidden = true; confirmRow.hidden = false; });
  const yes = button("हाँ, रद्द करें", "pbtn danger", async () => {
    yes.disabled = true;
    try {
      const r = await api("/api/cancel", { token: store.get("ns_pass") });
      confirmRow.hidden = true;
      msg.className = "pmsg ok";
      msg.textContent = r.ends_at
        ? `रद्द हो गया। ${new Date(r.ends_at * 1000).toLocaleDateString("hi-IN")} तक प्रीमियम चलेगा, उसके बाद पैसे नहीं कटेंगे।`
        : "रद्द हो गया। आगे से पैसे नहीं कटेंगे।";
    } catch (e) { yes.disabled = false; msg.className = "pmsg"; msg.textContent = errorText(e); }
  });
  const no = button("नहीं", "pbtn secondary", () => { confirmRow.hidden = true; cancelBtn.hidden = false; });
  confirmRow.append(txt("p", "plead", "पक्का रद्द करना है?"), yes, no);
  box.append(button("ऐप पर चलें", "pbtn", goHome), cancelBtn, confirmRow, msg);
}

/* ---------------- Start ---------------- */
goHome();
refreshEntitlement().then(changed => { if (changed && onHome) goHome(); });
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refreshEntitlement().then(changed => { if (changed && onHome) goHome(); });
});

/* ---------------- PWA: offline + install ---------------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
let deferredInstall = null;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  installBtn.hidden = false;
});
installBtn.onclick = async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  try { await deferredInstall.userChoice; } catch (e) {}
  deferredInstall = null;
  installBtn.hidden = true;
};
window.addEventListener('appinstalled', () => { installBtn.hidden = true; });
</script>
