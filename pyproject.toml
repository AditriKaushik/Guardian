[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian"
version = "0.1.0"
description = "A small, consent-first toolkit for listening to, viewing, and locating loved ones."
requires-python = ">=3.8"
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
