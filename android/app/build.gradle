plugins {
    id 'com.android.application'
}

// Release signing: the keystore and its passwords come ONLY from environment variables
// (CI sets them from GitHub secrets; see docs/SUBSCRIPTION_SETUP.md). Nothing secret lives in
// this file. If any of the four is missing, the release build is simply left unsigned and debug
// builds are unaffected, so the project still builds on any machine without the keystore.
def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.trim().isEmpty() }

android {
    namespace 'org.guardian.buddy'
    compileSdk 35

    defaultConfig {
        applicationId 'org.guardian.buddy'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '2.0'
    }

    buildFeatures {
        // BuildConfig.DEBUG switches WebView remote debugging on for debug builds only.
        buildConfig true
    }

    // The app IS the web app: the repository's web/ folder is bundled as the APK's assets and
    // served inside the WebView from https://appassets.androidplatform.net/ (see WebViewActivity).
    sourceSets {
        main {
            assets.srcDir '../../web'
        }
    }

    androidResources {
        // Android's default ignore list, plus web/ files that don't belong in the app: hosting
        // headers, docs, the service worker (the shell serves files itself) and any tests.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:!_headers:!*.md:!sw.js:!*.test.js:!*.spec.js:<dir>test:<dir>tests:<dir>node_modules'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        // The debug build type keeps Android's defaults (debuggable, signed with the debug key).
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // Don't run the extra "lint vital" pass inside assembleRelease. CI builds the release APK on
        // every push, and that pass adds a slow separate analysis that can stop a release over lint
        // findings (or lint tool hiccups) that don't affect users. Code correctness is covered by the
        // unit tests; run `./gradlew lintRelease` by hand to see the full lint report before a launch.
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
